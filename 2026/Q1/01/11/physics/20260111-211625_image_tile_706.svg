</text><text class="terminal-4034191133-r1" x="0" y="434.8" textLength="12.2" clip-path="url(#terminal-4034191133-line-17)">│</text><text class="terminal-4034191133-r1" x="1464" y="434.8" textLength="12.2" clip-path="url(#terminal-4034191133-line-17)">
</text><text class="terminal-4034191133-r1" x="0" y="459.2" textLength="1464" clip-path="url(#terminal-4034191133-line-18)">│&#160;move)&#160;must&#160;be&#160;followed&#160;by&#160;an&#160;immediate&#160;broadcast&#160;to&#160;all&#160;active&#160;agent&#160;PIDs&#160;in&#160;comms/.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-4034191133-r1" x="1464" y="459.2" textLength="12.2" clip-path="url(#terminal-4034191133-line-18)">
