</text><text class="terminal-4034191133-r1" x="0" y="68.8" textLength="1464" clip-path="url(#terminal-4034191133-line-2)">│&#160;-&#160;**GNU&#160;Screen&#160;Title&#160;Stability**:&#160;The&#160;Screen&#160;tab&#160;title&#160;is&#160;anchored&#160;to&#160;the&#160;agent&#x27;s&#160;name&#160;at&#160;registration.&#160;Agents&#160;must&#160;&#160;&#160;</text><text class="terminal-4034191133-r1" x="1464" y="68.8" textLength="12.2" clip-path="url(#terminal-4034191133-line-2)">
</text><text class="terminal-4034191133-r1" x="0" y="93.2" textLength="12.2" clip-path="url(#terminal-4034191133-line-3)">│</text><text class="terminal-4034191133-r1" x="1464" y="93.2" textLength="12.2" clip-path="url(#terminal-4034191133-line-3)">
</text><text class="terminal-4034191133-r1" x="0" y="117.6" textLength="1464" clip-path="url(#terminal-4034191133-line-4)">│&#160;NEVER&#160;rename&#160;the&#160;tab&#160;of&#160;a&#160;peer.&#160;Failure&#160;to&#160;anchor&#160;the&#160;tab&#160;is&#160;a&#160;breach&#160;of&#160;entry&#160;protocol.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-4034191133-r1" x="1464" y="117.6" textLength="12.2" clip-path="url(#terminal-4034191133-line-4)">
</text><text class="terminal-4034191133-r1" x="0" y="142" textLength="12.2" clip-path="url(#terminal-4034191133-line-5)">│</text><text class="terminal-4034191133-r1" x="1464" y="142" textLength="12.2" clip-path="url(#terminal-4034191133-line-5)">
</text><text class="terminal-4034191133-r1" x="0" y="166.4" textLength="1464" clip-path="url(#terminal-4034191133-line-6)">│&#160;-&#160;**The&#160;Grep&#160;Prohibition&#160;&amp;&#160;Precise&#160;Discovery**:&#160;Unstructured&#160;recursive&#160;searching&#160;across&#160;the&#160;metarepo&#160;is&#160;strictly&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-4034191133-r1" x="1464" y="166.4" textLength="12.2" clip-path="url(#terminal-4034191133-line-6)">
</text><text class="terminal-4034191133-r1" x="0" y="190.8" textLength="12.2" clip-path="url(#terminal-4034191133-line-7)">│</text><text class="terminal-4034191133-r1" x="1464" y="190.8" textLength="12.2" clip-path="url(#terminal-4034191133-line-7)">
</text><text class="terminal-4034191133-r1" x="0" y="215.2" textLength="1464" clip-path="url(#terminal-4034191133-line-8)">│&#160;prohibited.&#160;Systems&#160;of&#160;this&#160;magnitude&#160;(71+&#160;repositories)&#160;cannot&#160;be&#160;&#x27;grepped&#x27;&#160;without&#160;destroying&#160;the&#160;agent&#x27;s&#160;context&#160;&#160;&#160;</text><text class="terminal-4034191133-r1" x="1464" y="215.2" textLength="12.2" clip-path="url(#terminal-4034191133-line-8)">
</text><text class="terminal-4034191133-r1" x="0" y="239.6" textLength="12.2" clip-path="url(#terminal-4034191133-line-9)">│</text><text class="terminal-4034191133-r1" x="1464" y="239.6" textLength="12.2" clip-path="url(#terminal-4034191133-line-9)">
</text><text class="terminal-4034191133-r1" x="0" y="264" textLength="1464" clip-path="url(#terminal-4034191133-line-10)">│&#160;window&#160;and&#160;causing&#160;computational&#160;OOM.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-4034191133-r1" x="1464" y="264" textLength="12.2" clip-path="url(#terminal-4034191133-line-10)">
</text><text class="terminal-4034191133-r1" x="0" y="288.4" textLength="12.2" clip-path="url(#terminal-4034191133-line-11)">│</text><text class="terminal-4034191133-r1" x="1464" y="288.4" textLength="12.2" clip-path="url(#terminal-4034191133-line-11)">
</text><text class="terminal-4034191133-r1" x="0" y="312.8" textLength="1464" clip-path="url(#terminal-4034191133-line-12)">│&#160;-&#160;**Substrate-Aware&#160;Search**:&#160;Agents&#160;must&#160;prioritize&#160;structured&#160;file&#160;discovery&#160;(ls,&#160;glob)&#160;over&#160;recursive&#160;grep.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-4034191133-r1" x="1464" y="312.8" textLength="12.2" clip-path="url(#terminal-4034191133-line-12)">
